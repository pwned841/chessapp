<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg">
  <pattern id="chessPattern" width="50" height="50" patternUnits="userSpaceOnUse">
    <rect width="25" height="25" fill="#000000" />
    <rect width="25" height="25" fill="#000000" x="25" y="25" />
    <rect width="25" height="25" fill="transparent" x="25" y="0" />
